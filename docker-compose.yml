# ============================================================
# TIENDA-TEC - Orquestacion de todos los servicios con Docker Compose
#
#   Internet --> tienda-nginx (80/443)
#                  |-- /api/* --> tienda-be-1, tienda-be-2 --> tienda-db (Oracle), tienda-redis
#                  |-- resto  --> tienda-fe-1, tienda-fe-2
#
# Uso:  ./generar-env.sh            (solo la primera vez: crea .env con contrasenas aleatorias)
#       docker compose up -d --build
# ============================================================
name: tienda-tec

# --- Bloques reutilizables (anclas YAML) para las dos replicas de cada servicio ---
x-backend: &backend
  build: ./TIENDA_BE
  image: tienda-be:1.0
  restart: unless-stopped
  environment:
    DB_URL: jdbc:oracle:thin:@//tienda-db:1521/FREEPDB1
    DB_USER: TIENDA_APP
    DB_PASSWORD: ${TIENDA_APP_PASSWORD:?Falta TIENDA_APP_PASSWORD en .env}
    JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
    CORS_ORIGENES: https://${DOMINIO:?Falta DOMINIO en .env}
    REDIS_HOST: tienda-redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
  depends_on:
    tienda-db:
      condition: service_healthy
    tienda-redis:
      condition: service_healthy
  networks: [red-app, red-datos]
  healthcheck:
    # Cualquier respuesta HTTP (aunque sea 401) indica que la API esta viva
    test: ["CMD-SHELL", "wget -S --spider http://localhost:8080/api/auth/login 2>&1 | grep -q 'HTTP/'"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  deploy:
    resources:
      limits:
        memory: 1g

x-frontend: &frontend
  build: ./TIENDA-FE
  image: tienda-fe:1.0
  restart: unless-stopped
  environment:
    NG_ALLOWED_HOSTS: ${DOMINIO},www.${DOMINIO},localhost,127.0.0.1
  networks: [red-app]
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 256m

services:
  # ---------- Base de datos ----------
  tienda-db:
    build: ./BASE_DE_DATOS
    image: tienda-db:1.0
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Falta ORACLE_PASSWORD en .env}
      TIENDA_TEC_PASSWORD: ${TIENDA_TEC_PASSWORD:?Falta TIENDA_TEC_PASSWORD en .env}
      TIENDA_APP_PASSWORD: ${TIENDA_APP_PASSWORD}
      TIENDA_ADMIN_PASSWORD: ${TIENDA_ADMIN_PASSWORD:?Falta TIENDA_ADMIN_PASSWORD en .env}
      TIENDA_CONSULTA_PASSWORD: ${TIENDA_CONSULTA_PASSWORD:?Falta TIENDA_CONSULTA_PASSWORD en .env}
    volumes:
      - tienda-db-datos:/opt/oracle/oradata
    networks: [red-datos]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m   # la primera vez crea la BD y carga los scripts
    deploy:
      resources:
        limits:
          memory: 3g

  # ---------- Cache ----------
  tienda-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # contrasena para redis-cli (healthcheck)
    networks: [red-datos]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- Backend (2 replicas) ----------
  tienda-be-1:
    <<: *backend
  tienda-be-2:
    <<: *backend

  # ---------- Frontend (2 replicas) ----------
  tienda-fe-1:
    <<: *frontend
  tienda-fe-2:
    <<: *frontend

  # ---------- Proxy inverso / balanceador ----------
  tienda-nginx:
    build: ./NGINX
    image: tienda-nginx:1.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./NGINX/certs:/etc/nginx/certs   # certificado de origen de Cloudflare (Paso 9)
    depends_on:
      - tienda-be-1
      - tienda-be-2
      - tienda-fe-1
      - tienda-fe-2
    networks: [red-app]
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  red-app:      # nginx <-> frontend <-> backend
  red-datos:    # backend <-> Oracle / Redis; sin salida a Internet
    internal: true

volumes:
  tienda-db-datos:
