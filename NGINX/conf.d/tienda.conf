# ============================================================
# TIENDA-TEC - Configuracion de Nginx (se incluye dentro del bloque http)
# ============================================================

# --- Generales ---
server_tokens off;                  # no revelar la version de Nginx
client_max_body_size 5m;

# Formato de registro: incluye la replica que atendio cada peticion (upstream).
# Se aplica en cada bloque server para reemplazar el registro por defecto de nginx.conf.
log_format tienda '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'upstream=$upstream_addr tiempo=$request_time';

# Compresion de respuestas de texto (JS, CSS, JSON)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# IP real del visitante cuando el trafico pasa por Cloudflare
include /etc/nginx/snippets/cloudflare-ips.conf;

# Limite de intentos de inicio de sesion: 5 por minuto por IP (proteccion contra fuerza bruta)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# --- Balanceo de carga ---
# zone: memoria compartida para que todos los procesos worker de Nginx usen el mismo
# estado del balanceo (sin ella, cada worker reparte por su cuenta).
# Backend: least_conn envia cada peticion a la replica con menos conexiones activas.
# max_fails/fail_timeout: tras 3 fallos, la replica se excluye 15 s (chequeo pasivo).
upstream tienda_backend {
    zone tienda_backend 64k;
    least_conn;
    server tienda-be-1:8080 max_fails=3 fail_timeout=15s;
    server tienda-be-2:8080 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Frontend: reparto por turnos (round robin, metodo por defecto)
upstream tienda_frontend {
    zone tienda_frontend 64k;
    server tienda-fe-1:4000 max_fails=3 fail_timeout=15s;
    server tienda-fe-2:4000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# --- HTTP (puerto 80): solo redirige a HTTPS ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log tienda;

    # Chequeo de salud del propio Nginx (usado por Docker)
    location = /nginx-salud {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (puerto 443) ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log tienda;

    # Certificado de origen de Cloudflare (Paso 9) o autofirmado en pruebas
    ssl_certificate     /etc/nginx/certs/origen.pem;
    ssl_certificate_key /etc/nginx/certs/origen.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Encabezados de seguridad
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Encabezados que reciben el backend y el frontend
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Si una replica no responde, reintentar en la otra (solo peticiones que no modifican datos)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 2s;          # red interna: una replica sana conecta en milisegundos
    proxy_read_timeout 60s;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://tienda_backend;
    }

    location /api/ {
        proxy_pass http://tienda_backend;
    }

    location / {
        proxy_pass http://tienda_frontend;
    }
}
