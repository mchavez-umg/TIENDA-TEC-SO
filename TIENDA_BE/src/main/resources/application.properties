spring.application.name=TIENDA_BE

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:TIENDA_APP}
spring.datasource.password=${DB_PASSWORD:App2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA = TIENDA_TEC
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=TIENDA_TEC
spring.jpa.show-sql=false
# Dialecto fijo: el backend arranca aunque Oracle aun no este disponible (no lo consulta al iniciar)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

app.jwt.secret=${JWT_SECRET:tienda-tec-clave-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiracion-horas=8
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=${CACHE_TTL:10m}
spring.cache.redis.key-prefix=tienda::
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
